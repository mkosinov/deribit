[project]
name = "deribit-price_ticker"
version = "0.1.0"
description = "Test task"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src/price_ticker"]
testpaths = ["src/tests"]
markers = [
    "db: test runs against the disposable postgres container (needs Docker)",
]

[tool.ruff]
src = ["src/price_ticker"]
